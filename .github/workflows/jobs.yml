name: Update jobs

# Reads the UN agencies' job sites and saves every open P-3 post in Rome to jobs.json,
# which the TV's home screen shows in the greeting card.
on:
  schedule:
    - cron: "23 4 * * *"   # every morning, before 7 in Rome
    - cron: "23 12 * * *"  # and again early in the afternoon
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: QR codes for the job links
        run: pip install --quiet segno==1.6.6
      - name: Find the jobs
        run: python3 -m scraper.jobs
      - name: Save jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          n=$(python3 -c 'import json; print(json.load(open("jobs.json"))["count"])')
          git commit -q -m "Update jobs: $n open P-3 posts in Rome"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
